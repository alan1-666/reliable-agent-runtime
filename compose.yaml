services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime -d agent_runtime"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - agent-runtime-postgres:/var/lib/postgresql/data
      - ./migrations:/migrations:ro

volumes:
  agent-runtime-postgres:
